name: Migrate RESEARCH OS manual

on:
  push:
    paths:
      - ".github/workflows/migrate-manual.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manual repository
        uses: actions/checkout@v4

      - name: Fetch current manual from RESEARCH OS
        run: |
          git clone --depth 1 https://github.com/dolivaresDataSci1987/sitio-research-os.git /tmp/research-os
          cp /tmp/research-os/docs/*.md .
          cp /tmp/research-os/docs/_config.yml .

      - name: Publish manual files at repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.md instalacion.md primeros-pasos.md proyectos-participantes.md biobanco.md estudios-experimentos.md agenda.md documentacion-finanzas.md informes-exportaciones.md datos-seguridad.md faq.md glosario.md _config.yml
          git commit -m "Publish RESEARCH OS user manual" || exit 0
          git push
